services:
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: dhivon_mcp_gateway_test
      POSTGRES_USER: dhivon_mcp_gateway_test
      POSTGRES_PASSWORD: isolated-fixture-password
    ports:
      - "127.0.0.1:18432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhivon_mcp_gateway_test -d dhivon_mcp_gateway_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-test:/var/lib/postgresql
volumes:
  postgres-test:
