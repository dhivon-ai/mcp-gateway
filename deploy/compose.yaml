services:
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: dhivon
      POSTGRES_USER: dhivon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Supply a private deployment env file}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhivon -d dhivon"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
  dhivon:
    image: ${DHIVON_MCP_GATEWAY_IMAGE:-dhivon-mcp-gateway-server:0.1.0}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    user: "${DHIVON_MCP_GATEWAY_UID:-10001}:${DHIVON_MCP_GATEWAY_GID:-10001}"
    environment:
      DATABASE_URL: postgres://dhivon:${POSTGRES_PASSWORD:?Supply a private deployment env file}@postgres:5432/dhivon
      DHIVON_MCP_GATEWAY_PUBLIC_URL: ${DHIVON_MCP_GATEWAY_PUBLIC_URL:?Set the external HTTPS origin}
      DHIVON_MCP_GATEWAY_VAULT_KEY_FILE: /run/dhivon/vault-keys.json
    volumes:
      - type: bind
        source: ${DHIVON_MCP_GATEWAY_KEY_FILE:?Supply an external owner-only key file}
        target: /run/dhivon/vault-keys.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${DHIVON_MCP_GATEWAY_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    restart: unless-stopped
volumes:
  postgres:
