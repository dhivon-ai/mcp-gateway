name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/dhivon-mcp-gateway-build/cargo
      DHIVON_MCP_GATEWAY_BUILD_CACHE: ${{ runner.temp }}/dhivon-mcp-gateway-build
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --workspace
      - run: bash scripts/check-contracts.sh
      - if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
  web:
    runs-on: ubuntu-24.04
    env:
      DHIVON_MCP_GATEWAY_BUILD_CACHE: ${{ runner.temp }}/dhivon-mcp-gateway-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.4.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @dhivon/mcp-gateway-site typecheck
      - run: pnpm exec prettier --check apps/site
      - run: pnpm site:build
  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: dhivon_mcp_gateway_test
          POSTGRES_USER: dhivon_mcp_gateway_test
          POSTGRES_PASSWORD: isolated-fixture-password
        ports: ["18432:5432"]
        options: --health-cmd "pg_isready -U dhivon_mcp_gateway_test -d dhivon_mcp_gateway_test" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/dhivon-mcp-gateway-build/cargo
      TEST_DATABASE_URL: postgres://dhivon_mcp_gateway_test:isolated-fixture-password@127.0.0.1:18432/dhivon_mcp_gateway_test
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo test --locked -p dhivon-mcp-gateway-server -- --ignored

  deployment:
    runs-on: ubuntu-24.04
    env:
      DHIVON_MCP_GATEWAY_BUILD_CACHE: ${{ runner.temp }}/dhivon-mcp-gateway-release-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: mkdir -p "$DHIVON_MCP_GATEWAY_BUILD_CACHE"
      - run: docker build -f deploy/Dockerfile -t dhivon-mcp-gateway-server:0.1.0 .
      - run: node scripts/verify-deployment.ts
