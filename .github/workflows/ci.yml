name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/gateway-build/cargo
      GATEWAY_BUILD_CACHE: ${{ runner.temp }}/gateway-build
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --workspace
      - run: bash scripts/check-contracts.sh
      - if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
  web:
    runs-on: ubuntu-24.04
    env:
      GATEWAY_BUILD_CACHE: ${{ runner.temp }}/gateway-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.4.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: gateway_test
          POSTGRES_USER: gateway_test
          POSTGRES_PASSWORD: isolated-fixture-password
        ports: ["18432:5432"]
        options: --health-cmd "pg_isready -U gateway_test -d gateway_test" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/gateway-build/cargo
      TEST_DATABASE_URL: postgres://gateway_test:isolated-fixture-password@127.0.0.1:18432/gateway_test
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo test --locked -p gateway-server -- --ignored
